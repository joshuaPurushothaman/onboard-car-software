services:
  deserializer:
    container_name: deserializer
    build:
      context: ./services/deserializer
      dockerfile: Dockerfile
    privileged: true # required for forwarding CAN interface from host to container
    network_mode: host # ^
    # restart: unless-stopped
    depends_on:
      - redis
    environment:
      - CAN_INTERFACE=${CAN_INTERFACE:-vcan0}
      - DBC_DIR=/app/dbc-files
      - REDIS_PORT=${REDIS_PORT:-6380}
    volumes:
      - ./dbc-files:/app/dbc-files:ro

  redis:
    container_name: redis
    image: redis:8.2.2 # using official redis image, version 8.2.2 for "stability"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"] # starting redis with custom config
    volumes:
      - ./services/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro # mounting the redis config from host, read only
      - redis-data:/data # named volume for data persistence
    ports:
      # Expose Redis on localhost for the host-networked deserializer
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    restart: unless-stopped # restarts the container if it crashes

  kafka-connector:
    container_name: kafka-connector
    build:
      context: ./services/kafka-connector
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - DEVICE_NAME=${DEVICE_NAME}
      - CONNECT_BOOTSTRAP_SERVERS=${CONNECT_BOOTSTRAP_SERVERS}
      - CONNECT_REST_ADVERTISED_HOST_NAME=${CONNECT_REST_ADVERTISED_HOST_NAME}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 50s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 10s

volumes:
    redis-data: # named volume for redis data persistence
      driver: local